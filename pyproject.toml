[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-engine"
version = "1.1.0"
description = "Flagship code quality & infinite 2M context persistence for compact AI models."
readme = "README.md"
authors = [
    { name = "Ismeet Pandey", email = "ismeetpandey3@gmail.com" }
]
license = { text = "MIT" }
keywords = ["ai-agents", "antigravity", "claude-code", "codex", "llm-memory", "context-compression", "tdd"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
apex = "scripts.condense:main"
apex-gate = "scripts.gatekeeper:main"

[project.urls]
Homepage = "https://github.com/IsmeetPandey/apex-engine"
Repository = "https://github.com/IsmeetPandey/apex-engine.git"
Issues = "https://github.com/IsmeetPandey/apex-engine/issues"
