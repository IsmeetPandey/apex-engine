[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-engine"
version = "3.1.0"
description = "Make vibe coding cheap: Flagship quality, infinite context & autonomous guardrails for compact AI models."
readme = "README.md"
authors = [
    { name = "Ismeet Pandey", email = "ismeetpandey3@gmail.com" }
]
license = { text = "MIT" }
keywords = ["vibe-coding", "ai-agents", "antigravity", "claude-code", "codex", "llm-memory", "context-compression", "tdd"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
apex = "scripts.apex_cli:main"
apex-gate = "scripts.gatekeeper:main"
apex-condense = "scripts.condense:main"
apex-vibe = "scripts.vibe_synthesizer:main"
apex-deps = "scripts.dep_guard:main"
apex-heal = "scripts.self_heal:main"
apex-studio = "scripts.studio:main"
apex-blast = "scripts.blast_analyzer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[project.urls]
Homepage = "https://github.com/IsmeetPandey/apex-engine"
Repository = "https://github.com/IsmeetPandey/apex-engine.git"
Issues = "https://github.com/IsmeetPandey/apex-engine/issues"
